[project]
name = "researchpilotai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "himanshubinwal", email = "24ce01034@iitbbs.ac.in" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.143.5",
    "google-genai>=2.33.0",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "python-dotenv>=1.2.4",
    "pydantic-settings",
    "tavily-python",
    "rich>=15.0.0",
    "langchain-groq>=1.1.3",
    "langchain-core>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.20.0",
    "pypdf>=6.21.2",
    "fonttools>=4.65.0",
    "uvicorn>=0.54.0",
    "logfire[fastapi,httpx,requests]>=5.4.0",
    "langchain-tavily>=0.2.18",
]

[project.scripts]
researchpilotai = "researchpilotai:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "awesome-project"
]
